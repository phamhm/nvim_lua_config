allow_remote_control yes
listen_on unix:/tmp/mykitty

#customize tab bar
#tab_separator       "|"
# options: powerline, fade, slant, sepator
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
tab_bar_min_tabs    1

clipboard_control write-clipboard write-primary read-clipboard read-primary

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0

cursor_trail 3
#cursor_trail_decay 0.1 0.4

clear_all_shortcuts yes

# For Linux/Windows layout users
#map ctrl+c copy_to_clipboard
map ctrl+alt+v paste_from_clipboard

# Create a new tab (tmux: prefix + c)
map ctrl+alt+t new_tab

# Close the current tab (tmux: prefix + &)
#map ctrl+w close_tab

# Switch to the previous tab (tmux: prefix + p)
# map alt+p previous_tab

# Switch to specific tabs 1-9 (tmux: prefix + 0-9)
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
map ctrl+alt+0 toggle_layout stack

# Prevent shell integration from managing the title
shell_integration no-title

# Render the active window's title in the tab bar template
tab_title_template "({index}) {title}"
active_tab_title_template "({index}) {title}"

# Set the default layout to 'splits'
enabled_layouts splits, stack

# create vertical splits
map ctrl+alt+enter launch --location=vsplit

# move between Windows
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
# map ctrl+alt+j neighboring_window down
# map ctrl+alt+k neighboring_window up
map ctrl+alt+w close_window

#kitten quick-access-terminal
# map ctrl+` launch --type=background kitten quick-access-terminal --instance-group scripts-runner /bin/zsh -c '$HOME/.scripts/selectors.zsh'
# map ctrl+alt+` launch --type=background kitten quick-access-terminal --instance-group

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include m_theme.conf

# END_KITTY_THEME
#
# map ctrl+alt+n move_tab_forward
# map ctrl+alt+p move_tab_backward
# Switch to the next tab (tmux: prefix + n)
map ctrl+alt+n next_tab
map ctrl+alt+p previous_tab
